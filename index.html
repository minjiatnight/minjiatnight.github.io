<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="민지엣나잇 영상 속 그 옷, 룩 번호로 찾아보세요">
<meta property="og:title" content="민지엣나잇 스토어">
<meta property="og:description" content="영상 속 그 옷, 룩 번호로 찾아보세요">
<meta name="theme-color" content="#14101f">
<title>민지엣나잇 스토어</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#14101f; --surface:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
    --text:#f6f2ff; --dim:#a79fc0; --accent:#ff9fc4; --accent-ink:#2a0f1d; --warn:#ffd27a;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{padding:0 16px;min-height:100vh;background:radial-gradient(60% 40% at 80% 0%,rgba(255,159,196,.16),transparent 60%),radial-gradient(60% 40% at 0% 30%,rgba(124,110,255,.14),transparent 60%),var(--bg)}
  .wrap{max-width:480px;margin:0 auto;padding:28px 0 48px}
  header{text-align:center;margin-bottom:22px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--dim);font-size:14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
  .tab{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
  .pov{font-size:13px;color:var(--accent);margin:0 0 14px}
  .look{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:16px}
  .look h2{font-size:16px;margin:0 0 10px}
  .look h2 span{color:var(--accent);margin-right:6px}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px}
  .gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#222}
  .items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  a.item{display:block;padding:8px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.04);color:var(--text);text-decoration:none}
  a.item img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#222}
  .name{margin-top:8px;font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.7em}
  .price{margin-top:4px;font-size:13px;color:var(--accent);font-weight:600}
  .tag{display:inline-block;margin-top:5px;padding:1px 7px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);font-size:11px;font-weight:500}
  .go{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
  footer{margin-top:24px;color:var(--dim);font-size:12px;line-height:1.7;text-align:center}
  .gallery img{cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:50;background:rgba(10,7,18,.92);display:none;align-items:center;justify-content:center;padding:56px 12px 24px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;touch-action:pan-y}
  .lb button{position:absolute;border:0;color:#fff;background:rgba(255,255,255,.14);width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb .x{top:max(12px,env(safe-area-inset-top));right:14px}
  .lb .pv{left:10px;top:50%;transform:translateY(-50%)}
  .lb .nx{right:10px;top:50%;transform:translateY(-50%)}
  .lb .cnt{position:absolute;top:max(22px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌙 민지엣나잇 스토어</h1>
    <p>영상 속 그 옷, 룩 번호로 찾아보세요</p>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="pov" id="pov"></p>
  <main id="looks"></main>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
    <span class="cnt" id="lbcnt"></span>
    <button class="x" id="lbx" aria-label="닫기">✕</button>
    <button class="pv" id="lbpv" aria-label="이전 사진">‹</button>
    <img id="lbimg" alt="">
    <button class="nx" id="lbnx" aria-label="다음 사진">›</button>
  </div>
  <footer>
    이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>
    사진은 AI로 생성한 이미지예요. 실제 상품과 색상·핏이 다를 수 있으니 상품 페이지의 색상·사이즈 옵션을 꼭 확인해 주세요.
  </footer>
</div>
<script src="data.js?v=20261021e"></script>
<script>
  const $ = id => document.getElementById(id);
  const won = n => n ? n.toLocaleString('ko-KR') + '원' : '';
  function render(i){
    const ep = EPISODES[i];
    [...$('tabs').children].forEach((b,j)=>b.setAttribute('aria-selected', j===i));
    $('pov').textContent = 'POV : ' + ep.pov;
    $('looks').innerHTML = ep.looks.map((l,n)=>{
      const gal = (l.imgs||[]).slice(0,3).map(f=>'<img loading="lazy" src="img/'+f+'" alt="'+l.name+'">').join('');
      const items = l.items.filter(it=>!it.hide).map(it=>
        '<a class="item" href="'+it.url+'" target="_blank" rel="noopener sponsored">' +
        '<img loading="lazy" src="img/'+it.img+'" alt="">' +
        '<div class="name">'+it.name+'</div><div class="price">'+won(it.price)+'</div>' +
        (it.ok?'':'<span class="tag">색상 확인 중</span>') + '<span class="go">보러가기 ›</span></a>').join('');
      return '<section class="look"><h2><span>Look '+(n+1)+'</span>'+l.name+'</h2>' + (gal?'<div class="gallery">'+gal+'</div>':'') + '<div class="items">'+items+'</div>' + '</section>';
    }).join('');
  }
  // 사진 크게 보기: 갤러리 사진을 누르면 확대, ✕·바깥 영역·Esc로 닫기, ‹ › 와 좌우 스와이프로 넘기기
  let lbList=[], lbIdx=0;
  const lb=$('lb'), lbimg=$('lbimg');
  function lbShow(){ lbimg.src=lbList[lbIdx]; $('lbcnt').textContent=(lbIdx+1)+' / '+lbList.length; const many=lbList.length>1; $('lbpv').style.display=$('lbnx').style.display=many?'flex':'none'; }
  function lbOpen(list,i){ lbList=list; lbIdx=i; lbShow(); lb.classList.add('on'); document.body.style.overflow='hidden'; }
  function lbClose(){ lb.classList.remove('on'); document.body.style.overflow=''; lbimg.removeAttribute('src'); }
  function lbMove(d){ lbIdx=(lbIdx+d+lbList.length)%lbList.length; lbShow(); }
  document.addEventListener('click', e=>{
    const g=e.target.closest && e.target.closest('.gallery img');
    if(g){ const imgs=[...g.parentElement.querySelectorAll('img')]; lbOpen(imgs.map(x=>x.src), imgs.indexOf(g)); return; }
    if(e.target===lb) lbClose();
  });
  $('lbx').onclick=lbClose; $('lbpv').onclick=()=>lbMove(-1); $('lbnx').onclick=()=>lbMove(1);
  document.addEventListener('keydown', e=>{ if(!lb.classList.contains('on')) return; if(e.key==='Escape') lbClose(); if(e.key==='ArrowLeft') lbMove(-1); if(e.key==='ArrowRight') lbMove(1); });
  let tx=null; lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50) lbMove(dx<0?1:-1); },{passive:true});
  EPISODES.forEach((ep,i)=>{ const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.textContent=ep.tab; b.onclick=()=>render(i); $('tabs').appendChild(b); });
  render(EPISODES.length-1);
</script>
</body>
</html>
