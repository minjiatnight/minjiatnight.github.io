<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="민지엣나잇 영상 속 그 옷, 룩 번호로 찾아보세요">
<meta property="og:title" content="민지엣나잇 스토어">
<meta property="og:description" content="영상 속 그 옷, 룩 번호로 찾아보세요">
<meta name="theme-color" content="#14101f">
<title>민지엣나잇 스토어</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#14101f; --bg2:#1d1730; --surface:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
    --text:#f6f2ff; --dim:#a79fc0; --accent:#ff9fc4; --accent-ink:#2a0f1d;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{padding:0 16px;min-height:100vh;background:radial-gradient(60% 40% at 80% 0%,rgba(255,159,196,.16),transparent 60%),radial-gradient(60% 40% at 0% 30%,rgba(124,110,255,.14),transparent 60%),var(--bg)}
  .wrap{max-width:480px;margin:0 auto;padding:28px 0 48px}
  header{text-align:center;margin-bottom:22px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--dim);font-size:14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
  .tab{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
  .pov{font-size:13px;color:var(--accent);margin:0 0 14px}
  .look{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 14px 6px;margin-bottom:14px}
  .look h2{font-size:16px;margin:0 0 8px}
  .look h2 span{color:var(--accent);margin-right:6px}
  a.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px}
  a.item:first-of-type{border-top:0}
  a.item b{flex:none;font-weight:600;color:var(--accent);font-size:13px}
  a.item small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  footer{margin-top:24px;color:var(--dim);font-size:12px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌙 민지엣나잇 스토어</h1>
    <p>영상 속 그 옷, 룩 번호로 찾아보세요</p>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="pov" id="pov"></p>
  <main id="looks"></main>
  <footer>
    이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>
    영상과 이미지는 AI로 생성했어요. 실제 상품과 색상·핏이 다를 수 있으니 상품 페이지에서 확인해 주세요.
  </footer>
</div>
<script src="data.js"></script>
<script>
  const tabs = document.getElementById('tabs'), looksEl = document.getElementById('looks'), povEl = document.getElementById('pov');
  function render(i){
    const ep = EPISODES[i];
    [...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected', j===i));
    povEl.textContent = 'POV : ' + ep.pov;
    looksEl.innerHTML = ep.looks.map((l,n)=>
      '<section class="look"><h2><span>Look ' + (n+1) + '</span>' + l.name + '</h2>' +
      l.items.map(it=>'<a class="item" href="' + (it.url || ep.fallback) + '" target="_blank" rel="noopener sponsored"><div>' + it.name + (it.note?'<small>'+it.note+'</small>':'') + '</div><b>' + (it.price||'') + '</b></a>').join('') +
      '</section>').join('');
  }
  EPISODES.forEach((ep,i)=>{ const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.textContent=ep.tab; b.onclick=()=>render(i); tabs.appendChild(b); });
  render(EPISODES.length-1);
</script>
</body>
</html>
